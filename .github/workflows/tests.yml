name: Recipe browser tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Live reading and cooking verification
        if: github.ref == 'refs/heads/feature/easier-cooking'
        run: node tests/usability-live.cjs
      - name: Live photos verification
        if: github.ref == 'refs/heads/feature/recipe-photos'
        run: node tests/photos-live.cjs
      - name: Live instructions verification
        if: github.ref == 'refs/heads/feature/black-gold-instructions'
        run: node tests/instructions-live.cjs
      - name: Live portions verification
        if: github.ref == 'refs/heads/feature/shopping-portions'
        run: node tests/portions-live.cjs
      - name: Live Chefkoch import verification
        if: github.ref == 'refs/heads/feature/chefkoch-ingredients-test'
        run: node tests/chefkoch-live.cjs
      - name: Live isolated drawer verification
        if: github.ref == 'refs/heads/feature/simple-shared-drawer'
        run: node tests/drawer-live.cjs
