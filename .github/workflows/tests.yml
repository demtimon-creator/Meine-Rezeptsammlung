name: Recipe browser tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Live isolated drawer verification
        if: github.ref == 'refs/heads/feature/simple-shared-drawer'
        run: node tests/drawer-live.cjs
