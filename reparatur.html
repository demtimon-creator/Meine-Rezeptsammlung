<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rezeptsammlung reparieren</title><style>body{font:17px -apple-system,system-ui,sans-serif;background:#faf7f1;color:#28241f;padding:25px;line-height:1.5}button{border:0;border-radius:12px;background:#385546;color:white;padding:17px;font-size:17px;width:100%}</style></head><body><h2>Rezeptsammlung aktualisieren</h2><p>Diese Reparatur entfernt alte Programmdateien. Deine gespeicherten Rezepte werden dabei nicht gelöscht.</p><button id="repair">App reparieren und öffnen</button><p id="status"></p><script>document.getElementById('repair').onclick=async()=>{document.getElementById('status').textContent='Alte App-Dateien werden entfernt …';try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches' in window){for(const k of await caches.keys())if(k.startsWith('rezepte-iphone-'))await caches.delete(k)}}catch(e){document.getElementById('status').textContent='Cache konnte nicht vollständig entfernt werden.'}location.replace('./?frisch='+Date.now())}</script></body></html>
